<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OKLCH Picker</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="root">

    <div id="plotrow" class="plotrow">
      <div id="plot" class="plot">
        <div id="plotSurface" class="surface"></div>
        <div id="plotMarker" class="marker"><i></i></div>
      </div>
      <div id="lRamp" class="vramp">
        <div id="lRampSurface" class="surface"></div>
        <div id="lRampThumb" class="vthumb"></div>
      </div>
    </div>

    <div id="swatchrow" class="swatchrow">
      <div id="swatch" class="swatch"></div>
      <input id="hexInput" class="hex" type="text" spellcheck="false" value="#000000">
    </div>

    <div id="sliders" class="sliders">
      <div class="slider">
        <span class="axis">L</span>
        <div id="lTrack" class="track">
          <div id="lTrackSurface" class="surface"></div>
          <div id="lThumb" class="thumb"></div>
        </div>
      </div>
      <div class="slider">
        <span class="axis">C</span>
        <div id="cTrack" class="track">
          <div id="cTrackSurface" class="surface"></div>
          <div id="cThumb" class="thumb"></div>
        </div>
      </div>
      <div class="slider">
        <span class="axis">H</span>
        <div id="hTrack" class="track">
          <div id="hTrackSurface" class="surface"></div>
          <div id="hThumb" class="thumb"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="src/color.js"></script>
  <script src="src/png.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ps.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
